<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do you like day drinking?</title>
<meta property="og:title" content="Do you like day drinking??">
<meta property="og:type" content="website">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="stage">

  <section class="screen is-active" data-screen="question">
    <p>Do you like day drinking?</p>
    <div class="choices">
      <button data-go="invite">Yes</button>
      <button data-go="reconsider">No</button>
    </div>
  </section>

  <section class="screen" data-screen="invite">
    <p>You have been considered for an invitation to my twenty third birthday celebration.</p>
    <div class="choices">
      <button data-go="details">Continue</button>
    </div>
  </section>

  <section class="screen" data-screen="details">
    <dl>
      <dt>When</dt>  <dd>Saturday 19 September 2026</dd>
      <dt>Time</dt>  <dd>12!!</dd>
      <dt>Where</dt> <dd>Cremorne Point (Near le Abode)</dd>
      <dt>Designed By</dt> <dd>Seba</dd>

    </dl>
  </section>

  <section class="screen" data-screen="reconsider">
    <p>Would you like to reconsider your choice?</p>
    <div class="choices">
      <button data-go="question">Yes</button>
      <button data-go="rejected">No</button>
    </div>
  </section>

  <section class="screen" data-screen="rejected">
    <p>You are not invited. LEL.</p>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
